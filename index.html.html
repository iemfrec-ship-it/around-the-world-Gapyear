<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧭 Around the World: Gap Year Mission — Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Vollkorn:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#E7D8B6;--kraft2:#DCC79C;--kraftln:#C7AE80;--paper:#F7EFDD;
  --navy:#1F3B4D;--navy2:#2F5C74;--nl:#E3EDF1;
  --stamp:#B5451B;--stamp2:#D46A3E;--sl:#F7E4D8;
  --gold:#B8892B;--gl:#F5EAD0;
  --red:#B5301F;--green:#3F7D4F;
  --ink:#2B2117;
  --bg:radial-gradient(ellipse at top,#F2E7CB 0%,#E7D3A6 55%,#DCC393 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vollkorn',Georgia,serif;background:var(--bg);min-height:100vh;background-attachment:fixed;color:var(--ink)}
h1,h2,h3,.pop{font-family:'Special Elite',monospace;letter-spacing:.01em}
.hand{font-family:'Caveat',cursive}
.page{max-width:800px;margin:0 auto;padding:16px 18px 40px}
.card{background:var(--paper);border-radius:6px;box-shadow:0 5px 0 rgba(43,33,23,.06),0 8px 24px rgba(43,33,23,.14);padding:24px;margin-bottom:14px;border:1px solid var(--kraftln);position:relative}
.card-navy{border-top:4px solid var(--navy)}
.card-stamp{border-top:4px solid var(--stamp)}
.card-gold{border-top:4px solid var(--gold)}
/* ── Washi tape corner ── */
.tape{position:absolute;top:-10px;left:26px;width:64px;height:22px;background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 6px,#C9A94A 6px,#C9A94A 12px);opacity:.75;transform:rotate(-4deg);box-shadow:0 2px 3px rgba(0,0,0,.15)}
/* ── Buttons ── */
.btn{border:none;cursor:pointer;font-family:'Special Elite',monospace;font-weight:400;border-radius:4px;padding:10px 22px;font-size:.86rem;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 3px 0 #0F232F}
.btn-navy:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #0F232F}
.btn-stamp{background:var(--stamp);color:#fff;box-shadow:0 3px 0 #7A2A0F}
.btn-stamp:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #7A2A0F}
.btn-gold{background:var(--gold);color:#2B2117;box-shadow:0 3px 0 #7C5D1B}
.btn-gold:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #7C5D1B}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #7A1F13}
.btn-red:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #7A1F13}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 0 #275434}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #275434}
.btn-gray{background:#DED2B6;color:#5A4E38}
.btn-gray:hover:not(:disabled){background:#CFC1A0}
.btn-outline{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn-outline:hover:not(:disabled){background:var(--nl)}
.lg{font-size:.98rem;padding:13px 30px}
.sm{font-size:.76rem;padding:6px 14px}
.full{width:100%;justify-content:center}
/* ── Header ── */
.hdr{background:rgba(247,239,221,.96);backdrop-filter:blur(8px);border-bottom:2px solid var(--kraftln);padding:10px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(43,33,23,.12)}
.hdr-in{max-width:800px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
/* ── Progress (passport stamps) ── */
.prg{display:flex;align-items:center;flex:1}
.prg-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;transition:all .3s;flex-shrink:0;border:2px dashed transparent}
.prg-done{background:var(--navy);color:#fff;box-shadow:0 0 0 3px var(--nl)}
.prg-active{background:var(--stamp);color:#fff;box-shadow:0 0 0 3px var(--sl);border-color:#fff;animation:pls .8s ease-in-out infinite}
.prg-future{background:#EAE0C6;color:#B3A480}
.prg-line{flex:1;height:2px;margin:0 2px;background-image:linear-gradient(to right,var(--kraftln) 40%,transparent 0%);background-size:6px 2px;background-repeat:repeat-x}
.prg-lbl{font-size:.5rem;font-weight:700;color:#A9976D;text-align:center;margin-top:2px;max-width:50px;line-height:1.1}
/* ── Score pill (passport) ── */
.sc-pill{background:var(--navy);color:#fff;padding:5px 15px;border-radius:4px;font-weight:700;font-size:.85rem;white-space:nowrap;box-shadow:0 3px 8px rgba(31,59,77,.35);font-family:'Special Elite'}
.score-fab{position:fixed;top:12px;right:14px;z-index:45;background:var(--navy);color:#fff;padding:7px 16px;border-radius:4px;font-weight:700;font-size:.85rem;box-shadow:0 3px 12px rgba(31,59,77,.4);white-space:nowrap;font-family:'Special Elite';border:1px solid #0F232F}
/* ── Persistent buttons ── */
.prof-fab{position:fixed;bottom:16px;right:16px;z-index:40}
.rep-fab{position:fixed;bottom:16px;left:16px;z-index:40}
/* ── Inputs ── */
input,textarea{font-family:'Vollkorn',serif;border:2px solid var(--kraftln);border-radius:5px;padding:10px 13px;font-size:.92rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s;background:#FFFCF4;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,59,77,.12)}
textarea{resize:vertical;font-family:'Vollkorn',serif;line-height:1.6}
/* ── QCM ── */
.opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:2px solid var(--kraftln);border-radius:6px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.87rem;transition:border-color .15s,background .15s;background:#FFFCF4}
.opt:hover{border-color:var(--navy2);background:var(--nl)}
.opt.sel{border-color:var(--navy);background:#E3EDF1}
.opt.right{border-color:var(--green);background:#E9F3EA}
.opt.wrong{border-color:var(--red);background:#F8E6E2}
.let{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0;transition:all .15s;font-family:'Special Elite'}
/* ── V/F ── */
.vfr{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid var(--kraftln);border-radius:6px;margin-bottom:7px;transition:all .15s;flex-wrap:wrap;background:#FFFCF4}
.tvf{padding:5px 13px;border-radius:4px;border:2px solid;cursor:pointer;font-weight:700;font-size:.77rem;transition:all .15s;font-family:'Special Elite'}
/* ── Matching ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 12px;border:2px solid var(--kraftln);border-radius:5px;cursor:pointer;font-weight:600;font-size:.82rem;min-height:50px;display:flex;align-items:center;transition:all .15s;line-height:1.35;background:#FFFCF4}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:var(--stamp);background:var(--sl)}
.mi.msel{border-color:var(--stamp);background:#F2D7C4;box-shadow:0 0 0 3px rgba(181,69,27,.18)}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:var(--green);background:#E9F3EA;opacity:1;cursor:default}
.mi.mko{border-color:var(--red);background:#F8E6E2;opacity:1;cursor:default}
/* ── Situation postcard ── */
.sit{background:#FFFCF4;border:2px dashed var(--navy);border-radius:8px;padding:18px;position:relative}
.slbl{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);margin-bottom:2px;font-family:'Special Elite'}
.sval{font-weight:600;font-size:.9rem;margin-bottom:12px;line-height:1.5}
.hint{background:var(--gl);border:2px dashed var(--gold);border-radius:6px;padding:9px 13px;font-size:.82rem;font-weight:700;color:#7C5D1B}
/* ── Reading ── */
.rtxt{background:#FFFCF4;border-left:4px solid var(--navy2);padding:15px;border-radius:0 6px 6px 0;font-size:.87rem;line-height:1.8;margin-bottom:14px;color:#333}
/* ── Stamps (stars) ── */
.stars{font-size:1.4rem;letter-spacing:2px;color:var(--gold)}
/* ── Indice box (passport page) ── */
.ibx{background:var(--navy);border-radius:8px;padding:26px;text-align:center;border:2px solid #0F232F}
.iwd{font-family:'Special Elite',monospace;font-size:2.1rem;font-weight:400;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.25)}
/* ── Banners ── */
.ok{background:#E9F3EA;border:2px solid var(--green);border-radius:6px;padding:11px;font-weight:700;color:#1B4A28;font-size:.88rem}
.ko{background:var(--gl);border:2px solid var(--gold);border-radius:6px;padding:11px;font-weight:700;color:#7C5D1B;font-size:.88rem}
.err{background:#F8E6E2;border:2px solid var(--red);border-radius:6px;padding:11px;font-weight:700;color:#7A1F13;font-size:.88rem}
/* ── Animations ── */
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.fadein{animation:fadein .32s ease-out}
.chip{background:var(--navy);color:#fff;padding:3px 11px;border-radius:4px;font-weight:700;font-size:.76rem;display:inline-block;margin:2px;font-family:'Special Elite'}
@media(max-width:580px){.mg{grid-template-columns:1fr}.card{padding:17px}.iwd{font-size:1.5rem}.lg{font-size:.9rem;padding:11px 22px}}
@media print{.noprint{display:none!important}}
</style>
</head>

const ftm=(s,e)=>{if(!s||!e)return'—';const d=Math.round((e-s)/1e3);return`${0|d/60}min ${d%60}s`;};
function starRating(n,t){const p=t?n/t:0;if(p>=.9)return{s:3,msg:'Excellent ! 🔥',c:'#B8892B'};if(p>=.8)return{s:2,msg:'Bien joué ! 👍',c:'#1F3B4D'};if(p>=.6)return{s:1,msg:'Peut mieux faire',c:'#B5451B'};return{s:0,msg:'Courage, continuez ! 💪',c:'#B5301F'};}
function stars(n){return'<span class="stars">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(3-n)+'</span></span>';}
function wc(str){return (str.trim().match(/\S+/g)||[]).length;}

function buildQCMSet(items){
  return items.map((item,idx)=>{
    const others=items.filter((_,j)=>j!==idx);
    const distractors=shuf(others).slice(0,3).map(x=>x.d);
    const opts=shuf([item.d,...distractors]);
    return{q:`What does "${item.w}" mean?`,o:opts,c:opts.indexOf(item.d)};
  });
}

/* ═══════════════════════════ WRITTEN EXERCISES (QCM / VF / MATCH) ═══════════════════════════ */
function startWritten(mission,kind){
  S.att[mission]=1;
  goWrittenAttempt(mission,kind,0);
}
function goWrittenAttempt(mission,kind,attIdx,banner){
  if(kind==='qcm'){
    const qs=buildQCMSet(S.sets1[attIdx]);
    go('wex',{mission,kind,qs,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='vf'){
    const set=M3SETS[attIdx];
    go('wex',{mission,kind,qs:set.vf,text:set.text,title:set.title,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='match2'){
    const ps=S.sets2[attIdx];
    go('wex',{mission,kind,ps,sh:shuf(ps.map((_,i)=>i)),sel:null,mt:{},done:false,_banner:banner});
  }else if(kind==='match5'){
    const ps=S.sets5[attIdx];
    go('wex',{mission,kind,ps,sh:shuf(ps.map((_,i)=>i)),sel:null,mt:{},done:false,_banner:banner});
  }
}
function resolveWritten(mission,kind,score,total,wrongItems,detail){
  const att=S.att[mission];
  let passed,ptsDelta;
  if(att===1){passed=score>=Math.ceil(total*0.8);ptsDelta=passed?50:-10;}
  else if(att===2){passed=score>=Math.ceil(total*0.7);ptsDelta=passed?30:-15;}
  else{passed=score>=Math.ceil(total*0.5);ptsDelta=Math.round(score/total*20);}
  S.pts=S.pts+ptsDelta;
  S.res[mission+'-t'+att]={score,total,success:passed,pts:ptsDelta,detail};
  if(!passed)S.wr.push(...wrongItems);
  if(passed||att===3){

/* ── Matching renderer (generic, used by M2 and M5) ── */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    return`<div class="mi${sel===i?' msel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${done||isM?'':(`selW(${i})`)}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:var(--stamp);font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:var(--green)">✓</span>':''}${ko?'<span style="color:var(--red)">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    return`<div class="mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${isU?'':(`selD(${orig})`)}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${ps.length} bonnes réponses</div>${btn('Continuer →','wexDone()','stamp')}</div>`
    :(allM?btn('✅ Valider','E.done=true;render()','navy'):`<small style="color:#CFC1A0;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<div class="hint" style="margin-bottom:12px">⚠️ Aucun retour en arrière possible : lisez bien avant de valider chaque association !</div><p style="color:#A9976D;font-size:.8rem;margin-bottom:10px;font-weight:700">① Cliquez un terme → ② Cliquez sa correspondance</p>
  <div class="mg"><div><div style="font-weight:800;color:var(--stamp);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Termes</div>${words}</div>
  <div><div style="font-weight:800;color:var(--gold);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Correspondances</div>${defs}</div></div>
  <div style="margin-top:13px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}

function wexDone(){
  const{mission,kind,qs,ps,ans={},mt={}}=E;
  if(kind==='qcm'){
    const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
    const detail=qs.map((q,i)=>({question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c],ok:ans[i]===q.c}));
    const wrong=detail.filter(d=>!d.ok).map(d=>({level:'M1',question:d.question,given:d.given,correct:d.correct}));
    resolveWritten(mission,kind,score,qs.length,wrong,detail);
  }else if(kind==='vf'){
    const score=qs.filter((q,i)=>ans[i]===q.a).length;
    const detail=qs.map((q,i)=>({question:q.s,given:ans[i]!=null?(ans[i]?'VRAI':'FAUX'):'—',correct:q.a?'VRAI':'FAUX',ok:ans[i]===q.a}));
    const wrong=detail.filter(d=>!d.ok).map(d=>({level:'M3',question:d.question,given:d.given,correct:d.correct}));
    resolveWritten(mission,kind,score,qs.length,wrong,detail);
  }else if(kind==='match2'||kind==='match5'){
    const score=ps.filter((_,i)=>mt[i]===i).length;
    const detail=ps.map((p,i)=>({question:`Match : ${p.w}`,given:mt[i]!=null?(ps[mt[i]]?.d||'—'):'—',correct:p.d,ok:mt[i]===i}));
    const wrong=detail.filter(d=>!d.ok).map(d=>({level:kind==='match2'?'M2':'M5',question:d.question,given:d.given,correct:d.correct}));
    resolveWritten(mission,kind,score,ps.length,wrong,detail);
  }
}

/* ═══════════════════════════ ÉTAPE 7 — EMAIL FINAL ═══════════════════════════ */
function vM7(){
  const n=wc(S.m7.text||'');
  const ok=n>=120;
  return`<div class="card fadein" style="border-top:4px solid var(--stamp)">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:2.3rem">✍️</div>

    <p style="color:#555;font-size:.88rem;line-height:1.7;margin-bottom:12px">Consigne : rédigez un email EN ANGLAIS à votre conseiller(ère) d'orientation (<strong>120 mots minimum</strong>) dans lequel vous expliquez :</p>
    <ul style="color:#555;font-size:.85rem;line-height:1.9;margin:0 0 16px 18px">
      <li>votre motivation pour faire un gap year ;</li>
      <li>le type de mission que vous choisiriez (voyage, bénévolat, stage...) ;</li>
      <li>un frein possible et comment vous comptez le surmonter ;</li>
      <li>une compétence que vous espérez développer.</li>
    </ul>
    <textarea id="m7ta" rows="10" placeholder="Dear ..., I am writing to..." oninput="S.m7.text=this.value;render()">${S.m7.text||''}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span style="font-weight:700;font-size:.85rem;color:${ok?'var(--green)':'var(--stamp)'}">${n} / 120 mots minimum</span>
      ${ok?'<span class="ok" style="padding:5px 12px;font-size:.78rem">✓ Longueur suffisante</span>':''}
    </div>
    ${!ok?`<div class="err" style="margin-top:10px">✍️ Il manque ${120-n} mot(s) pour atteindre le minimum requis.</div>`:''}
    <div style="text-align:center;margin-top:16px">${btn('📥 Valider et voir mon carnet complet',ok?"go('rep')":"void(0)",'navy','lg')}</div>
  </div>`;
}

/* ═══════════════════════════ REPORT ═══════════════════════════ */
function vReport(){
  const dur=ftm(S.t0,S.t1);
  const LN={'m1-t1':'📝 Vocab — tentative 1','m1-t2':'📝 Vocab — tentative 2','m1-t3':'📝 Vocab — tentative 3',
    'm2-t1':'🧩 Options — tentative 1','m2-t2':'🧩 Options — tentative 2','m2-t3':'🧩 Options — tentative 3',
    'm3-t1':'📖 Récit — tentative 1','m3-t2':'📖 Récit — tentative 2','m3-t3':'📖 Récit — tentative 3',
    'm4-t1':'💬 Oral — tentative 1','m4-t2':'💬 Oral — tentative 2','m4-t3':'💬 Oral — tentative 3',
    'm5-t1':'🎒 Skills — tentative 1','m5-t2':'🎒 Skills — tentative 2','m5-t3':'🎒 Skills — tentative 3',
    'm6-t1':'🎬 Vidéo — tentative 1','m6-t2':'🎬 Vidéo — tentative 2','m6-t3':'🎬 Vidéo — tentative 3'};
  const rows=Object.entries(S.res).map(([k,v])=>{
    const scoreTxt=v.score!=null?`${v.score}/${v.total}`:(v.grade!=null?`${v.grade}/10`:'—');
    return`<tr><td style="padding:9px;font-weight:700;font-size:.84rem">${LN[k]||k}</td><td style="padding:9px"><span style="background:${v.success?'var(--green)':'var(--red)'};color:#fff;padding:2px 9px;border-radius:4px;font-size:.73rem;font-weight:800">${v.success?'✓ Réussi':'✗ Non réussi'}</span></td><td style="padding:9px;color:#7A6B4D;font-size:.84rem">${scoreTxt}</td><td style="padding:9px;color:${v.pts>=0?'var(--green)':'var(--red)'};font-size:.84rem;font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</td></tr>`;
  }).join('');
  const transcript=Object.entries(S.res).map(([k,v])=>{
    const scoreTxt=v.score!=null?`${v.score}/${v.total}`:(v.grade!=null?`${v.grade}/10`:'—');
    let inner='';
    if(v.detail){
      inner=v.detail.map(d=>`<div style="padding:7px 0;border-top:1px dashed var(--kraftln)"><div style="font-weight:600;font-size:.82rem;color:#333">${d.question}</div><div style="font-size:.78rem;color:${d.ok?'var(--green)':'var(--red)'};margin-top:2px">${d.ok?'✓':'✗'} Réponse donnée : ${d.given}</div>${!d.ok?`<div style="font-size:.78rem;color:var(--green)">✓ Correction : ${d.correct}</div>`:''}</div>`).join('');
    }else if(v.situation!=null){
      inner=`<div style="padding:7px 0;font-size:.82rem;color:#555">💬 Situation présentée : <strong>${v.situation||'—'}</strong><br>Note du professeur : <strong>${v.grade}/10</strong></div>`;
    }
    return`<div style="background:#FFFCF4;border-radius:6px;padding:12px 14px;margin-bottom:10px;border:1px dashed var(--kraftln)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <strong style="font-size:.86rem;color:var(--navy)">${LN[k]||k}</strong>
        <span style="font-size:.78rem;color:#7A6B4D">${scoreTxt} • <span style="color:${v.pts>=0?'var(--green)':'var(--red)'};font-weight:700">${v.pts>=0?'+':''}${v.pts} pts</span></span>
      </div>${inner}
    </div>`;
  }).join('');
  const errs=S.wr.length===0
    ?`<div class="ok" style="text-align:center;margin-top:6px">🏆 Aucune erreur enregistrée !</div>`
    :S.wr.map(w=>`<div style="background:#FFFCF4;border:1px solid var(--kraftln);border-radius:5px;padding:11px;margin-bottom:8px"><div style="font-weight:700;font-size:.84rem;color:#333">${w.question}</div><div style="color:var(--red);font-size:.8rem;margin-top:3px">✗ Réponse donnée : ${w.given||'—'}</div><div style="color:var(--green);font-size:.8rem">✓ Réponse correcte : ${w.correct}</div></div>`).join('');
  const m7block=(S.m7.text&&wc(S.m7.text)>0)
    ?`<div class="card"><div class="pop" style="color:var(--stamp);margin-bottom:10px;font-size:.95rem">✍️ Étape finale — Email (${wc(S.m7.text)} mots)</div><p style="white-space:pre-wrap;font-size:.87rem;line-height:1.7;color:#333">${(S.m7.text||'').replace(/</g,'&lt;')}</p></div>`
    :'';
  return`<div id="rep" style="max-width:780px;margin:0 auto;padding:20px;padding-bottom:40px">
  <div class="noprint" style="margin-bottom:14px;display:flex;gap:9px;flex-wrap:wrap">
    ${btn('← Retour',"go(S._returnTo||'vic',S._returnE||{})",'gray','sm')}
    ${btn('🖨️ Imprimer / Enregistrer PDF','window.print()','navy','sm')}
  </div>
  <div style="background:var(--navy);border-radius:8px;padding:28px;text-align:center;color:#fff;margin-bottom:16px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
    <div class="pop" style="font-size:1.4rem;margin-bottom:4px">🧭 Around the World: Gap Year Mission</div>
    <div style="opacity:.85;font-size:.88rem">English Escape Game — Bac Pro</div>
    <div style="opacity:.7;font-size:.78rem;margin-top:4px">${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div class="card" style="text-align:center;border-top:3px solid var(--navy)"><div style="font-weight:800;font-size:1rem;color:var(--navy)">${S.id||'—'}</div><div style="color:#7A6B4D;font-size:.78rem;margin-top:3px">Identifiant</div></div>
    <div class="card" style="text-align:center;border-top:3px solid var(--stamp)"><div class="pop" style="font-size:1.7rem;color:var(--navy)">${S.pts}</div><div style="color:#7A6B4D;font-size:.78rem">Points • ${dur}</div><div style="margin-top:6px">${stars(starRating(S.pts,360).s)}</div></div>
  </div>
  <div class="card"><div class="pop" style="color:var(--navy);margin-bottom:12px;font-size:.95rem">🎯 Résultats par mission</div>
    <table style="width:100%;border-collapse:collapse"><tr style="background:var(--nl)"><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Mission</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Résultat</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Score</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Points</th></tr>${rows}</table>
  </div>
  <div class="card"><div class="pop" style="color:var(--navy);margin-bottom:12px;font-size:.95rem">📝 Détail des réponses, corrections et scoring</div>${transcript||'<p style="color:#A9976D;font-size:.85rem">Aucune mission complétée pour le moment.</p>'}</div>
  ${m7block}
  <div class="card"><div class="pop" style="color:var(--red);margin-bottom:12px;font-size:.95rem">❌ Erreurs commises</div>${errs}</div>
  <div style="background:var(--navy);border-radius:8px;padding:14px 22px;text-align:center;font-family:'Special Elite';font-weight:400;font-size:1.05rem;color:#fff;margin-bottom:14px">✅ THIS TRIP CHANGED MY LIFE FOREVER</div>
  <div style="text-align:center;color:#A9976D;font-size:.76rem">Créé par C. Iemfre • Around the World: Gap Year Mission — English Escape Game Bac Pro</div>
  </div>`;
}

/* ═══════════════════════════ RGPD (texte reproduit mot pour mot) ═══════════════════════════ */
function vRGPD(){
  return`<div style="min-height:100vh;padding:20px 18px 40px">
  <div style="max-width:580px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:8px">
      <span style="color:#A9976D;cursor:pointer;font-size:.83rem;font-weight:700" onclick="go('home')">← Retour</span>
    </div>
    <div style="background:var(--navy);border-radius:8px;padding:26px;text-align:center;color:#fff;margin-bottom:18px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
      <div style="font-size:2.2rem;margin-bottom:8px">🔒</div>
      <h1 class="pop" style="font-size:1.3rem;margin-bottom:4px">Protection des données personnelles</h1>
      <p style="opacity:.75;font-size:.82rem">Around the World: Gap Year Mission — English Escape Game</p>
    </div>
    <div class="card" style="border-left:4px solid var(--navy);margin-bottom:10px">
      <p style="color:#333;font-size:.9rem;line-height:1.82">Cette application est un outil pédagogique développé pour un usage en classe.</p>
    </div>
    <div style="display:grid;gap:9px;margin-bottom:18px">
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucune donnée n'est transmise à un serveur externe : toutes les informations (nom d'équipe, identifiants, réponses, score, progression) restent uniquement stockées localement dans la mémoire de votre navigateur, sur l'appareil utilisé.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Les seules données saisies sont : le nom de votre équipe, les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices et votre progression dans le jeu.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Ces données sont conservées localement sur l'appareil utilisé, sous le nom de votre équipe, afin de vous permettre de reprendre votre progression lors d'une prochaine séance, sur ce même appareil. Elles ne sont jamais transmises, partagées, ni consultées par un tiers. Votre équipe peut à tout moment recommencer à zéro (la progression enregistrée est alors remplacée), ou effacer ces données en vidant les données de navigation de ce site dans votre navigateur.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</p>
      </div>
    </div>
  </div></div>`;
}

/* ═══════════════════════════ ROUTER ═══════════════════════════ */
function go(scr,ei={}){E=ei;S.scr=scr;render();window.scrollTo(0,0);}
function render(){document.getElementById('app').innerHTML=view()+profFab()+scoreBadge()+reportFab();saveProgress();}
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Élève','ident');
  if(sc==='ident')return vIdent();

  const W=hdr;
  /* Mission 1 — Why a Gap Year? (QCM) */
  if(sc==='m1i')return W(1)+`<div class="page">${lvlIntro('📝','Mission 1 — Why a Gap Year?','Objectifs et motivations','<p style="font-weight:700;margin-bottom:7px">What drives young people to take a gap year?</p><p style="font-size:.88rem;color:#555;line-height:1.7">Avant de partir, prouvez que vous maîtrisez le vocabulaire des objectifs et motivations d\u2019un gap year. 10 questions. Seuil de réussite : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m1','qcm')",'navy')}</div>`;
  if(sc==='wex'&&E.mission==='m1')return W(1)+`<div class="page">${E._banner||''}<div class="card card-navy"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--navy);color:#fff;padding:3px 12px;border-radius:4px;font-weight:800;font-size:.8rem">Tentative ${S.att.m1}</span><strong style="font-size:.95rem">QCM — Why a Gap Year?</strong></div>${vQCM()}</div></div>`;
  if(sc==='m1d')return W(1)+`<div class="page">${indiceScreen('m1',"go('m2i')")}</div>`;

  /* Mission 2 — Gap Year Options (matching FR/EN) */
  if(sc==='m2i')return W(2)+`<div class="page">${lvlIntro('🧩','Mission 2 — Gap Year Options','Types de missions','<p style="font-weight:700;margin-bottom:7px">So many ways to spend a gap year!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque terme français à sa traduction anglaise : voyage, bénévolat, stage, études à l\u2019étranger... Seuil : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Une fois une association validée, impossible de revenir en arrière !</p>',"startWritten('m2','match2')",'stamp')}</div>`;
  if(sc==='wex'&&E.mission==='m2')return W(2)+`<div class="page">${E._banner||''}<div class="card card-stamp"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--stamp);color:#fff;padding:3px 12px;border-radius:4px;font-weight:800;font-size:.8rem">Tentative ${S.att.m2}</span><strong style="font-size:.95rem">Correspondance FR/EN — Gap Year Options</strong></div>${vMatch()}</div></div>`;
  if(sc==='m2d')return W(2)+`<div class="page">${indiceScreen('m2',"go('m3i')")}</div>`;

  /* Mission 3 — Real Stories (VF) */
  if(sc==='m3i')return W(3)+`<div class="page">${lvlIntro('📖','Mission 3 — Real Stories','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">Real stories, real obstacles.</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez le témoignage puis répondez aux 8 affirmations Vrai/Faux. Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m3','vf')",'gold')}</div>`;
  if(sc==='wex'&&E.mission==='m3')return W(3)+`<div class="page">${E._banner||''}<div class="card card-gold"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--gold);color:#2B2117;padding:3px 12px;border-radius:4px;font-weight:800;font-size:.8rem">Tentative ${S.att.m3}</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='m3d')return W(3)+`<div class="page">${indiceScreen('m3',"go('m4i')")}</div>`;

  /* Mission 4 — Convince Them (Oral) */
  if(sc==='m4i')return W(4)+`<div class="page">${lvlIntro('💬','Mission 4 — Convince Them','Expression orale','<p style="font-weight:700;margin-bottom:7px">Time to defend your project!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Vous devez convaincre un interlocuteur sceptique du bien-fondé de votre projet de gap year, en anglais. <strong>Mots-clés seulement, 8 maximum, aucune phrase apprise.</strong></p>',"startOral('m4')",'navy')}</div>`;
  if(sc==='oex'&&E.mission==='m4')return W(4)+`<div class="page">${vOral()}</div>`;
  if(sc==='m4d')return W(4)+`<div class="page">${indiceScreen('m4',"go('m5i')")}</div>`;

  /* Mission 5 — Skills Gained (matching EN word/definition) */
  if(sc==='m5i')return W(5)+`<div class="page">${lvlIntro('🎒','Mission 5 — Skills Gained','Compétences développées','<p style="font-weight:700;margin-bottom:7px">What do you gain from a gap year?</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque compétence à sa définition en anglais. Seuil : ≥ 8/10. 3 tentatives possibles, aucun blocage.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Une fois une association validée, impossible de revenir en arrière !</p>',"startWritten('m5','match5')",'stamp')}</div>`;
  if(sc==='wex'&&E.mission==='m5')return W(5)+`<div class="page">${E._banner||''}<div class="card card-stamp"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--stamp);color:#fff;padding:3px 12px;border-radius:4px;font-weight:800;font-size:.8rem">Tentative ${S.att.m5}</span><strong style="font-size:.95rem">Correspondance — Skills Gained</strong></div>${vMatch()}</div></div>`;
  if(sc==='m5d')return W(5)+`<div class="page">${indiceScreen('m5',"go('m6i')")}</div>`;

  /* Mission 6 — Watch & Understand (video) */
  if(sc==='m6i')return W(6)+`<div class="page">${lvlIntro('🎬','Mission 6 — Watch & Understand','Compréhension orale','<p style="font-weight:700;margin-bottom:7px">One last mission: watch and understand!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Regardez la vidéo puis répondez aux 12 questions (Vrai/Faux et QCM mélangés). Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startVideo()",'gold')}</div>`;
  if(sc==='vex')return W(6)+`<div class="page">${vVideo()}</div>`;
  if(sc==='m6d')return W(6)+`<div class="page">${indiceScreen('m6',"go('fin')")}</div>`;

  if(sc==='fin')return W(6)+`<div class="page">${vFinal()}</div>`;
  if(sc==='vic')return W(6)+`<div class="page">${vVictory()}</div>`;
  if(sc==='m7')return W(6)+`<div class="page">${vM7()}</div>`;
  if(sc==='rep')return vReport();
  return'<p>Écran inconnu</p>';
}
render();
</script></body></html>
